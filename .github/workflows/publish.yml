name: Publish packages

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

defaults:
  run:
    shell: bash

jobs:
  github:
    uses: tree-sitter/workflows/.github/workflows/release.yml@main

  build-wasm:
    name: Build Wasm binaries
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm i --omit peer --omit optional
      - name: Build Wasm binaries
        run: npm x -- tree-sitter build --wasm
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          path: "*.wasm"
          name: prebuilds-wasm
          retention-days: 2

  build-node:
    name: Build NodeJS binaries on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - windows-2022
          - windows-11-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm i --omit peer --omit optional
      - name: Build binary
        run: npm x -- prebuildify -t 20.19.5
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          path: prebuilds/**
          name: prebuilds-${{matrix.os}}
          retention-days: 2

  npm:
    name: Publish NodeJS package
    needs: [build-wasm, build-node]
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{github.event.repository.name}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # Trusted publishing needs npm 11.5.1, newer than the one Node 22 ships.
      - name: Update npm
        run: npm i -g npm@latest
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
          pattern: prebuilds-*
          merge-multiple: true
      - name: Move Wasm binaries to root
        continue-on-error: true
        run: mv -v prebuilds/*.wasm .
      - name: Publish to npm
        run: npm publish --access public

  crates:
    name: Publish Rust package
    runs-on: ubuntu-24.04
    environment:
      name: crates
      url: https://crates.io/crates/tree-sitter-bend2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{steps.auth.outputs.token}}

  build-sdist:
    name: Build source dist
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --upgrade pip build setuptools wheel
      - name: Build sources
        run: python -mbuild -n -s
      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: dist-sources
          path: dist/*.tar.gz
          retention-days: 2

  build-wheels:
    name: Build wheels on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - windows-2025
          - windows-11-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: native
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{matrix.os}}
          path: dist/*.whl
          retention-days: 2

  pypi:
    name: Publish Python package
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/${{github.event.repository.name}}/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
