[package]
name = "tree-sitter-bend2"
description = "Bend grammar for tree-sitter"
version = "0.1.2"
authors = ["Amaan Qureshi <contact@amaanq.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "bend"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/amaanq/tree-sitter-bend"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
